[project]
name = "warehouse_validator"
version = "0.1.0"
description = "Warehouse validator for restock manifests"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["warehouse_validator*"]